name: quick-pr
# Fast, network-free unit + integrity tests on every push/PR (WP5 quick lane).
# Selects the QUICK marked set only — slow science sweeps run in slow-science.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Owner-authorized exception for this same-repository PR only. Main pushes and
# every other PR retain the normal suite. This is not a global QA-policy change.
env:
  PUCKWORKS_PR318_UNPROTECTED: ${{ github.repository == 'trbrewer/puckworks' && github.event_name == 'pull_request' && github.event.pull_request.number == 318 && github.event.pull_request.head.repo.full_name == 'trbrewer/puckworks' && github.event.pull_request.head.ref == 'model/pannusch2024-stateful-fv-004' }}

concurrency:
  group: quick-pr-${{ github.ref }}
  cancel-in-progress: true

# Owner-authorized PR #356 exception (2026-10-23): rerun and merge without the
# repository time limit after Python 3.12 timed out three times at 98-99%.
# GitHub-hosted jobs still have a six-hour platform maximum. Only this PR uses
# that allowance; main and other PRs retain the standing budgets below.
# Test selectors, interpreters, assertions, coverage floor and required checks
# are unchanged. See the Hargarten swelling kinetics VERIFICATION.md follow-up.
jobs:
  quick:
    runs-on: ubuntu-24.04
    # Ordinary budget raised 30 -> 60 minutes in the PR #357 G0 completion (2026-10-24).
    # At head 3e22e7c5, Python 3.12 timed out at 98% and 99%; coverage completed the
    # same selected suite in 1821.72 s: 7031 passed, 71 skipped, 64 deselected, 80% coverage.
    # Other interpreter runtimes varied substantially. This supports cumulative budget
    # exhaustion, not a particular hung test or a guarantee that unfinished runs pass.
    # The finite 60-minute ordinary budget preserves every test, interpreter, selector,
    # assertion and check. Retain the PR #356 exception above; another limit hit requires
    # concrete runtime diagnosis, not another automatic increase.
    timeout-minutes: ${{ github.repository == 'trbrewer/puckworks' && github.event_name == 'pull_request' && github.event.pull_request.number == 356 && 360 || 60 }}
    strategy:
      fail-fast: false          # R0: one Python version must not cancel/hide the other
      matrix:
        # EVERY advertised interpreter (pyproject classifiers 3.10-3.13) must be exercised:
        # oldest (3.10), 3.11, primary/release (3.12), newest (3.13).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Frozen producer/source identity tests need local history.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: lint (ruff, pyflakes ruleset)
        run: ruff check --output-format=github puckworks/ tests/
      - name: environment diagnostics
        run: |
          python -VV
          python -m pip --version
          python -m pip freeze
          python -m pytest --version
          echo "SHA=$GITHUB_SHA  PYTHONHASHSEED=${PYTHONHASHSEED:-unset}"
      - name: quick lane (offline, deterministic; excludes slow/live/gpu/external_data)
        run: |
          selector="not slow and not live and not gpu and not external_data"
          scope_args=()
          mode="normal"
          if [[ "$PUCKWORKS_PR318_UNPROTECTED" == "true" ]]; then
            mode="PR318 owner-authorized unprotected QA"
            selector="$selector and not protected_target_integrity"
            # These unmarked tests also interpret actual Angeloni target measurements.
            scope_args=(
              --deselect=tests/test_uncertainty_intake.py::test_angeloni_recovered_table_is_complete_and_self_consistent
              --deselect=tests/test_uncertainty_intake.py::test_recovered_angeloni_canonical_summary_validates
            )
          fi
          {
            printf 'QA mode: %s\nOuter pytest selector: `%s`\n' "$mode" "$selector"
            if [[ "$PUCKWORKS_PR318_UNPROTECTED" == "true" ]]; then
              printf 'Excluded: actual protected-target integrity tests, including the unmarked nodes below.\n'
              printf '  %s\n' "${scope_args[@]}"
              printf 'The existing 11 synthetic guard-child cases remain authorized and selected through their parents.\n'
              printf 'This is a disclosed selection exception; excluded target tests did not run.\n'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          pytest -q -m "$selector" "${scope_args[@]}" --junitxml=quick-report-${{ matrix.python-version }}.xml --durations=15
      - name: upload diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-pr-report-${{ matrix.python-version }}
          path: quick-report-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  min-deps:
    # Prove the declared lower bounds actually work (P0.5): install the MINIMUM numpy/scipy on the
    # oldest supported interpreter and run the offline suite. If this goes red, the pyproject floor
    # is wrong — not a mystery. Not a required check until the maintainer opts in.
    runs-on: ubuntu-24.04
    # Ordinary budget raised 30 -> 60 minutes with `quick` in the PR #357 G0 completion.
    # At head 3e22e7c5 this lane timed out on both attempts; the Python 3.12 coverage
    # run needed 1821.72 s for the same selected suite, before job setup/cleanup costs.
    # Keep the complete offline suite and minimum dependencies. This finite budget is
    # not a pass guarantee; another limit hit requires observed runtime diagnosis.
    timeout-minutes: ${{ github.repository == 'trbrewer/puckworks' && github.event_name == 'pull_request' && github.event.pull_request.number == 356 && 360 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Frozen producer/source identity tests need local history.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      # markdown-it-py is a pure-Python submission-scanner dependency, not a numeric floor.
      # It is installed here so the round-11 P1-6 structural scan actually RUNS on this lane
      # rather than reporting NOT RUN: a check that cannot look must not look like a check
      # that looked and found nothing.
      - run: pip install "numpy==2.0.*" "scipy==1.13.*" "pytest<10" markdown-it-py pyyaml && pip install -e . --no-deps
      - name: offline suite on the declared minimum dependencies
        run: |
          selector="not slow and not live and not gpu and not external_data"
          scope_args=()
          mode="normal"
          if [[ "$PUCKWORKS_PR318_UNPROTECTED" == "true" ]]; then
            mode="PR318 owner-authorized unprotected QA"
            selector="$selector and not protected_target_integrity"
            # These unmarked tests also interpret actual Angeloni target measurements.
            scope_args=(
              --deselect=tests/test_uncertainty_intake.py::test_angeloni_recovered_table_is_complete_and_self_consistent
              --deselect=tests/test_uncertainty_intake.py::test_recovered_angeloni_canonical_summary_validates
            )
          fi
          {
            printf 'QA mode: %s\nOuter pytest selector: `%s`\n' "$mode" "$selector"
            if [[ "$PUCKWORKS_PR318_UNPROTECTED" == "true" ]]; then
              printf 'Excluded: actual protected-target integrity tests, including the unmarked nodes below.\n'
              printf '  %s\n' "${scope_args[@]}"
              printf 'The existing 11 synthetic guard-child cases remain authorized and selected through their parents.\n'
              printf 'This is a disclosed selection exception; excluded target tests did not run.\n'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          pytest -q -m "$selector" "${scope_args[@]}"

  quality-mypy:
    # Keep static analysis independently bounded so it cannot consume the coverage budget.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.repository == 'trbrewer/puckworks' && github.event_name == 'pull_request' && github.event.pull_request.number == 356 && 360 || 25 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: mypy (core modules, Stage 1)
        run: mypy

  quality:
    # P1.3 quality ratchet — coverage FLOOR on the core public/release/control modules.
    # Mypy runs as the independently bounded quality-mypy job above.
    # Repeated #322 coverage timeouts justify this bounded 45-minute limit.
    # The suite, seven-module coverage scope, and 70% floor are unchanged.
    # Investigate any further timeout; do not automatically increase this limit.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.repository == 'trbrewer/puckworks' && github.event_name == 'pull_request' && github.event.pull_request.number == 356 && 360 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Frozen producer/source identity tests need local history.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: coverage floor on critical modules (baseline 70%; ratchet up over time)
        run: |
          selector="not slow and not live and not gpu and not external_data"
          scope_args=()
          mode="normal"
          if [[ "$PUCKWORKS_PR318_UNPROTECTED" == "true" ]]; then
            mode="PR318 owner-authorized unprotected QA"
            selector="$selector and not protected_target_integrity"
            # These unmarked tests also interpret actual Angeloni target measurements.
            scope_args=(
              --deselect=tests/test_uncertainty_intake.py::test_angeloni_recovered_table_is_complete_and_self_consistent
              --deselect=tests/test_uncertainty_intake.py::test_recovered_angeloni_canonical_summary_validates
            )
          fi
          {
            printf 'QA mode: %s\nOuter pytest selector: `%s`\n' "$mode" "$selector"
            if [[ "$PUCKWORKS_PR318_UNPROTECTED" == "true" ]]; then
              printf 'Excluded: actual protected-target integrity tests, including the unmarked nodes below.\n'
              printf '  %s\n' "${scope_args[@]}"
              printf 'The existing 11 synthetic guard-child cases remain authorized and selected through their parents.\n'
              printf 'This is a disclosed selection exception; excluded target tests did not run.\n'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Python 3.12 sys.monitoring preserves coverage semantics with lower tracing overhead.
          COVERAGE_CORE=sysmon coverage run --include="puckworks/validate.py,puckworks/statusdoc.py,puckworks/gate_runner.py,puckworks/registry.py,puckworks/release.py,puckworks/paper3/archive.py,puckworks/paper3/evidence_graph.py" \
            -m pytest -q -m "$selector" "${scope_args[@]}"
          coverage report --fail-under=70 --include="puckworks/validate.py,puckworks/statusdoc.py,puckworks/gate_runner.py,puckworks/registry.py,puckworks/release.py,puckworks/paper3/archive.py,puckworks/paper3/evidence_graph.py"
