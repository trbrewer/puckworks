name: Pocket Science assay synthetic fixtures
on:
  pull_request:
    paths:
      - 'puckworks/analysis/pocketscience2024_assay.py'
      - 'tests/test_pocketscience2024_assay.py'
      - '.github/workflows/pocketscience-assay.yml'
permissions:
  contents: read
jobs:
  assay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -e '.[reconstruct]' "pytest<10"
      - run: pytest -q tests/test_pocketscience2024_assay.py
