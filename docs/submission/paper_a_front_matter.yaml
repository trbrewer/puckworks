# carried a retired title, an older 237-word abstract, a seventh keyword, five repository-facing
# Highlights, and a status line calling completed analyses outstanding. Repairing those copies by
# hand is what produced the drift in the first place, so every submission-facing rendering of this
# metadata is now GENERATED from this file by `tools/paper_a_front_matter.py` and checked in CI by
