article_type: Research paper / original research article

# ---------------------------------------------------------------------------------------------
# Abstract. Target 230-240 words so that differing whitespace/hyphen counters cannot push the
# submitted file over the venue's 250-word limit. Current count is asserted by the test, not
# trusted from this comment.
#
# Third review MC1: the previous abstract was ~313 words and its "The profile had an interior
# numerical minimum..." sentence could be read as saying that ALL six solute x variety panels had
# interior minima. They do not: the objective minimum is interior in only 13 of 18 panel x
# objective cells, and Arabica 5-CQA sits at the upper boundary under all three objectives. The
# interior-minimum statement is therefore restricted to the illustrative caffeine panel, and the
# cross-panel summary reports the boundary-reaching count (16 of 18) instead.
#
# "clustered percentile range" replaces "95 % resampling interval": the procedure is a
# fixed-predictor paired clustered resampling sensitivity range, not a calibrated confidence
# interval, and the manuscript says so in Methods.
#
# Round-10 P0-1: the abstract's transfer sentences said the model showed "no resolvable skill
# beyond a transferred level". That is a decision — absence of incremental skill — and the declared
# analysis makes no decision at all: it has no calibrated coverage and no predeclared practical
# margin, as the same abstract's final sentences say. The point estimate favours the model. What is
# unestablished is whether that observed advantage is reproducible or useful, so the abstract now
# reports the observed difference with its sign and states the limit of the evidence.
# `puckworks.paper_a.claim_policy` enforces this against the artefact's declared inferential
# status: while that status supports no decision, the retired wording cannot be reintroduced here or
# anywhere else a reader can see it.
# ---------------------------------------------------------------------------------------------
abstract: >-
  Whole-cup espresso measurements can be predicted accurately even when extractable content and
  extraction rate are weakly separated. We examined a multi-solute extraction model calibrated to
  fraction-resolved data, recalibrated to optimal-grind whole-cup observations and evaluated
  at a matched 40 g endpoint. At each mass-transfer-rate multiplier an inventory level
  was re-estimated and the objective profiled. In the
  illustrative caffeine panel the minimum was interior but its 10 %-near-optimal set reached the
  upper tested boundary; across six panels and three objective families, near-optimal sets
  reached a boundary in 16 of 18 cases. After optimal-grind
  calibration, predictions on the complete held-out coarse- and fine-grind corpus (132
  observations) had 8.4 % pooled MAPE against 8.8 % for a concentration-only comparator. The paired
  difference was −0.394 percentage points, favouring the model, and the model was worse on 62 of
  132 observations. The primary clustered percentile range (−0.829 to +0.004) contained zero; these
  are uncalibrated sensitivity ranges with no predeclared margin, so they do not establish whether
  the advantage is reproducible or useful.
  Fraction-resolved observations produced sharper rate profiles
  than aggregated or simulated whole-cup ones. An external dissolved-solids trajectory retained
  only a shallow, high-error, loss-dependent preference. Matched endpoints are therefore necessary but insufficient: parameter
  localization, prediction error, incremental gain and cross-context evidence should be reported
  separately. Across the declared ±2 g tolerance the difference stayed between −0.447 and
  −0.394 points, excluding zero at 38 g only; at 40 g the bound's sign was numerically stable
  across seeds.
# Third review, front-matter section: `profile objective` is repository vocabulary and a poor
# indexing term; `model transfer` and `porous media` were package-only. Six terms, within the
# venue's limit of seven.
keywords:
  - espresso
  - extraction modelling
  - mass transfer
  - practical identifiability
  - time-resolved measurement
  - experimental design

# Elsevier asks that Highlights be accessible to a general audience. The retired set used
# "inventory-kinetics compensation profile", "benchmark skill" and "machine-readable result
# bundles" -- repository vocabulary, and the last is not a scientific finding at all.
# Each bullet is <= 85 characters including spaces; the test asserts this rather than trusting the
# counts, which is how the package's hand-maintained counts survived being wrong.
# Round-10 P0-1: "barely outperformed" is a superiority verdict softened by an adverb, and the
# analysis makes no superiority decision either. The bullet now reports the size of the observed
# gap, which is what the study measured.
#
# Round-11 P1-3: the Highlights file is uploaded SEPARATELY and read without the paragraphs that
# supply the limits, and "a process model's gain ... was under 0.4 points" reads, alone, as an
# established property of the model. It is now an explicitly OBSERVED quantity, and a fifth bullet
# carries the evidence boundary so the file cannot state the result without stating what it does not
# decide. `claim_policy.SURFACE_ASSERTIONS["highlights"]` makes dropping either one fail.
# JFE allows 3-5 bullets of at most 85 characters and no unexpanded acronyms, so the bullet says
# "pooled error" rather than "pooled MAPE"; these are 68/73/75/63/70 characters.
highlights:
  - Whole-cup espresso data weakly separate content from extraction rate
  - Observed pooled error was 0.394 points lower than a level-only comparator
  - Uncalibrated ranges support no superiority, equivalence or absence decision
  - Time-resolved samples constrained extraction rate more strongly
  - Accurate prediction did not guarantee well-determined model parameters

editor_significance: >-
  Whole-cup measurements are common in food-process model calibration because they are economical
  and directly relevant to product quality. This study shows that an apparently accurate integrated
  endpoint can leave the extraction rate weakly localized through compensation with extractable
  inventory, and that a mechanistic model can achieve acceptable held-out error while its observed
  gain over a trained level-only baseline is 0.394 percentage points of pooled error. The
  dependence-aware ranges reported here
  are uncalibrated sensitivity ranges with no predeclared practical margin, so they do not establish
  whether that gain is reproducible or practically useful: acceptable endpoint accuracy alone does
  not establish that the extraction mechanism transferred. The study also demonstrates a
  reporting workflow that separates parameter localization from held-out prediction and from
  incremental gain over a
  level-only comparator. The result bears directly on experimental design for extraction, leaching, dissolution and
  other food processes in which integrated product measurements can conceal internal transport-rate
  uncertainty.

