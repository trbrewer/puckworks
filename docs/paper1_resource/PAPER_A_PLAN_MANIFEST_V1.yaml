# Paper 1 pivot programme — machine-readable control surface.
#
# This file, not a Markdown heading, is the source of truth for: which plan is operative, what the
# gates are, how they depend on one another, what each must deliver, which repository surfaces carry
# CURRENT claims, and which assertions are banned from those surfaces.
#
# It exists because two successive plan revisions passed a prose-scanning test that did not
# implement the controls the plan said it implemented. The test is now driven by this file, and is
# fail-closed: a missing operative plan, an orphan gate, a dependency cycle, or a banned assertion on
# an active surface is a FAILURE, not a skip.
#
# Updating to a later plan revision should require editing this manifest only — never a test path.

schema_version: 1

operative_plan: docs/paper1_resource/PAPER_1_PIVOT_AND_REDRAFT_PLAN_V2_2.md
operative_status: proposal          # proposal | operative
# Set to the merge SHA when the plan is declared operative. `null` while under review.
operative_commit: null

superseded_plans:
  - docs/paper1_resource/PAPER_1_PIVOT_AND_REDRAFT_PLAN.md
  - docs/paper1_resource/PAPER_1_PIVOT_AND_REDRAFT_PLAN_V2.md
  - docs/paper1_resource/PAPER_1_PIVOT_AND_REDRAFT_PLAN_V2_1.md

# ─────────────────────────────────────────────────────────────────────────────────────────────
# Gates. `blocks_drafting` gates all block the results narrative, title, abstract, discussion and
# contribution list. Dependencies must form a DAG.
# ─────────────────────────────────────────────────────────────────────────────────────────────
gates:
  NUM-TIME-01:
    title: Is the high-rate plateau a BDF artefact or structural to the declared model?
    status: passed
    scope: numerical-model-structural; physical generalisation untested
    dependencies: []
    deliverables: [docs/paper1_resource/PAPER_A_SATURATION_VERIFICATION.json]
    blocks_drafting: false

  NUM-ENV-01:
    title: Do the FULL-SUPPORT contrasts survive mesh and tolerance change?
    status: passed
    scope: full-support estimands only; says nothing about fold medians
    dependencies: [NUM-TIME-01]
    deliverables: [docs/paper1_resource/PAPER_A_NUMERICAL_ENVELOPE.json]
    blocks_drafting: false

  P0-G0:
    title: Protocol and analysis freeze
    status: open
    dependencies: [P0-G1a, P0-G3a]
    deliverables:
      - docs/paper1_resource/PAPER_A_PIVOT_ANALYSIS_PROTOCOL_V1.md
    blocks_drafting: true

  P0-G1a:
    title: Initial claim and estimand ledger, before any new scientific run
    status: open
    dependencies: []
    deliverables:
      - docs/paper1_resource/PAPER_A_CLAIM_EVIDENCE_LEDGER_V2.json
      - docs/paper1_resource/PAPER_A_ACTIVE_CLAIM_RECONCILIATION.md
    blocks_drafting: true

  P0-G1b:
    title: Final claim reconciliation, after all analyses are frozen
    status: open
    dependencies: [P0-G4, P0-G5, P0-G6, P0-G7, P0-G8, P0-G9]
    deliverables: [docs/paper1_resource/PAPER_A_CLAIM_EVIDENCE_LEDGER_V2.json]
    blocks_drafting: true

  P0-G2:
    title: Disaggregation — every pooled headline shown with its components and weighting rule
    status: open
    dependencies: [P0-G1a]
    deliverables: []
    blocks_drafting: true

  P0-G3a:
    title: Initial model and evidence scope matrix, before scientific runs
    status: open
    dependencies: []
    deliverables: [docs/paper1_resource/PAPER_A_MODEL_SCOPE_MATRIX.md]
    blocks_drafting: true

  P0-G3b:
    title: Final cross-file scope reconciliation, before drafting
    status: open
    dependencies: [P0-G1b]
    deliverables: [docs/paper1_resource/PAPER_A_MODEL_SCOPE_MATRIX.md]
    blocks_drafting: true

  P0-G4:
    title: LOCO-WIDE — leave-one-condition-out refits on the frozen wide multiplier domain
    status: open
    dependencies: [P0-G0, P0-G9]
    deliverables: [docs/paper1_resource/PAPER_A_LOCO_WIDE_RESULTS.json]
    blocks_drafting: true

  P0-G5:
